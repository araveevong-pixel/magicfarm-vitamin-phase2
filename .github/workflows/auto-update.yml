name: Auto Update Dashboard

on:
  schedule:
    - cron: '7,37 * * * *'   # backup only, GitHub cron is often delayed or skipped
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write
  actions: write

# One run at a time. A newer queued run replaces an older queued one,
# so the self-scheduling chain below can never multiply.
concurrency:
  group: dashboard-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp
        run: pip install --upgrade yt-dlp

      - name: Sync sheet + scrape TikTok
        run: python3 scripts/sync.py

      # Commits ONLY the data files. index.html / config.json are never touched by the bot.
      - name: Commit data
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data/live.json data/history.json
          if git diff --cached --quiet; then
            echo "No changes"; exit 0
          fi
          git commit -m "data update $(TZ=Asia/Bangkok date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1

  # Self-scheduling: wait ~27 min on the "refresh-timer" environment (no runner is used
  # while waiting), then start the next run. Keeps the dashboard fresh every ~30 min
  # without depending on GitHub's cron.
  next:
    needs: sync
    if: always()
    runs-on: ubuntu-latest
    environment: refresh-timer
    steps:
      - name: Queue next refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Safety net: if the environment timer is ever removed, still wait ~25 min.
          created=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json createdAt -q .createdAt)
          elapsed=$(( $(date +%s) - $(date -d "$created" +%s) ))
          if [ "$elapsed" -lt 1500 ]; then sleep $(( 1500 - elapsed )); fi
          # Retry: GitHub's API occasionally returns a 5xx; one glitch must not stop the chain.
          for i in 1 2 3 4 5 6; do
            gh workflow run auto-update.yml --repo "$GITHUB_REPOSITORY" --ref main && exit 0
            echo "dispatch failed (attempt $i), retrying in $((i * 20))s"; sleep $((i * 20))
          done
          exit 1
